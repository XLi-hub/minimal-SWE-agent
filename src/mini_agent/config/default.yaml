# 权威默认运行配置 —— 工具实现与 schema 在 tools.py 注册表中，其余按需覆盖。
# 默认工具集：bash + submit + read + edit + write（文件工具默认启用）。
# 想要原来的「仅 bash + submit」路线：python main.py --config default_bash
# 优先级（低 → 高）：本文件 < --config 文件/key=value < MINI_AGENT_* 环境变量 < CLI 参数。
# 注意：API key 不放在这里 —— 它留在 .env（已 gitignore），这里只记环境变量「名」。

model:
  model_name: gpt-4o-mini
  base_url:
  api_key_env: OPENAI_API_KEY
  model_kwargs: {}

agent:
  system_prompt: |
    You are an autonomous software engineer solving tasks in a Linux environment. You have five tools:
    - `bash`: execute a shell command and see its output.
    - `read`: read a file's contents with line numbers.
    - `edit`: replace one exact string in a file with another.
    - `write`: create or overwrite a file with new content.
    - `submit`: call this when your task is complete.

    ## Core rules

    1. Think before you act — reason about what you need to do and why, then act ONE step at a time. Never batch multiple actions in a single call.
    2. Read before you edit — use `read` to view files, or `bash` with grep/ls/find to locate the right code. Guessing leads to wrong fixes.
    3. Make the smallest change that solves the problem. Use `edit` to change an exact string rather than rewriting a whole file.
    4. If a command or edit fails, read the error message carefully and adapt. For `edit`, make old_string unique (include surrounding lines) if it is ambiguous.
    5. Verify your work — re-read the changed file, run tests, or use git diff to review your changes before calling submit.
    6. When you are stuck, explore more rather than guessing. Use ls, find, grep, and git log to gather context.

    ## File tools

    - `read(path)` returns the file with line numbers so you can reference exact lines.
    - `edit(path, old_string, new_string)` replaces ONE occurrence of old_string. It fails if old_string is absent or appears more than once — provide enough context to make it unique.
    - `write(path, content)` creates or overwrites a file. Use it for new files or large rewrites.
    - Use `bash` for git, tests, and anything that is not plain file reading/writing.

    ## Output limits

    Command output is bounded by both line and character budgets (defaults: 100 lines and 20,000 characters). If you need more context, use head/tail/sed to narrow the command before raising `lines`. For long-running commands like pip install or git clone, pass a higher `timeout` value (default 30s).

  instance_template: |
    ## Task
    {{ task }}

    ## Workflow
    Follow these steps to complete the task:

    1. **Explore** — understand the repository structure. Find and read the files relevant to the task.
    2. **Diagnose** — identify the root cause. If it is a bug, create a minimal script to reproduce it before fixing.
    3. **Fix** — make the necessary changes. Edit source files to resolve the issue.
    4. **Verify** — confirm the fix works. Re-run your reproduction script, run existing tests, or check the output manually.
    5. **Submit** — call the submit tool with your patch (from git diff), the final answer, or a summary of what was done.

    Start now — begin with step 1 (Explore).

  summary_prompt: |
    Summarize the agent's conversation history so it can continue without the full transcript. Be concise and factual; preserve exact file paths, command names, error messages, and test results. Use these headers:

    ## Task
    ## Files Changed
    ## Key Decisions
    ## Errors / Test Results
    ## Current State
    ## Next Steps

    ### Existing summary (may be empty)
    {{ existing_summary }}

    ### New history since the last summary
    {{ new_lines }}

  summary_marker: "[CONTEXT SUMMARY]"
  context_window: 64000
  compress_threshold: 0.8
  reserve_tokens: 2000
  keep_last_n_turns: 4
  max_steps: 250
  max_time: 1800.0
  cost_limit: 3.0
  # Plain-text responses normally end a run; benchmark configs may allow a
  # small number of correction prompts for truncated/malformed responses.
  no_tool_call_retries: 0

tools:
  # 工具 schema + handler 在 mini_agent.tools.TOOL_REGISTRY 中成对注册；
  # 这里的名单同时控制「发给模型」和「允许执行」。
  enabled:
    - bash
    - submit
    - read
    - edit
    - write

  default_max_lines: 100
  default_max_chars: 20000
  default_timeout: 30

cost:
  # Default prices are intentionally zero because OpenAI-compatible providers
  # use different billing. Set these per provider/model to enable cost limits.
  price_input_per_1m: 0.0
  price_input_cache_hit_per_1m: 0.0
  price_output_per_1m: 0.0

environment:
  type: local
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: "-R"
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
  image: python:3.11-slim
  cwd: "/"
  timeout: 30
  container_timeout: 2h
  # Docker-specific execution options (ignored by LocalEnvironment).
  forward_env: []
  executable: docker
  run_args:
    - --rm
  pull_timeout: 120
  interpreter:
    - bash
    - -lc
  block_network_commands: false
